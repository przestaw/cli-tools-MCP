version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
    - copyloopvar
    - revive # only the "exported" rule below: exported symbols need a doc comment
  settings:
    revive:
      rules:
        - name: exported
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Scanln
        - fmt.Sscanf
        - (io.Closer).Close
        - (*os.File).Close
  exclusions:
    rules:
      # Test helpers and fakes may ignore write errors.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
